English. Maintains conversation context across sessions. Built for service businesses: barbershops, restaurants, healthcare practices.</li><li><strong>Sales Automation Agents</strong> — AI agents that autonomously identify leads, draft personalized outreach, manage connection requests, and qualify prospects. Established 150+ meaningful connections per run on LinkedIn with sophisticated profile analysis.</li><li><strong>Customer Service AI Agent</strong> — Autonomous customer support agent for <a href="https://virelio.ai">virelio.ai</a> with ElevenLabs voice synthesis, n8n workflow automation, and OpenAI conversation processing. Handles meetings, answers inquiries, and provides 24/7 support without human intervention.</li><li><strong>Operations Automation Agents</strong> — AI agents automating back-office operations: email management, calendar scheduling, research tasks, invoice processing, and document generation. Personal operations agent runs 24/7 with persistent memory and custom tool APIs, delivering +30% daily efficiency increase.</li><li><strong>Multi-Agent Development Crew</strong> — Autonomous agent system with 6 specialized agents (research agent, code agent, review agent) orchestrated via CrewAI and LangGraph. Reduced project execution time by 80% through parallelized agent workflows.</li><li><strong>AI Meeting Agent</strong> — Meeting intelligence agent with real-time transcription, automated summarization, speaker diarization, automatic action item assignment, and calendar integration. Runs offline with Whisper.cpp and local LLMs. Saves teams 5 hours per week.</li><li><strong>Enterprise RAG Agent Platform</strong> — Intelligent document retrieval agent indexing millions of documents with 95% accuracy and sub-second response times. Connects to 10+ data sources. Built with Llama 3, Qdrant, FastAPI, and LangChain.</li><li><strong>Slouch - AI Posture Coach Agent</strong> — Client-side AI agent running 100% in the browser using MediaPipe Pose. Monitors posture via webcam in real-time. Zero data leaves the device. <a href="https://slouch.pro">slouch.pro</a></li><li><strong>Invoice Fraud Prevention Agent</strong> — AI-powered risk scoring agent that reduced payment defaults by 73%, improved cash flow by 45%, processes 50k+ monthly transactions, and recovered EUR 2M+ in outstanding payments.</li><li><strong>Medical Compliance AI Agent</strong> — AI agent accelerating medical device technical dossier creation 5x using NLP and regulatory compliance algorithms for FDA, CE marking, and ISO standards.</li><li><strong>Claude Workflow Automation Agents</strong> — 30+ advanced Claude prompt engineering workflows integrated into 20+ core business processes using Anthropic API, Artifacts, and MCP Servers.</li></ul><h2>Types of AI Agents Omar Nassar Builds</h2><ul><li><strong>WhatsApp AI Agents</strong> — Autonomous chatbots on WhatsApp Business API for customer support, booking, and lead generation</li><li><strong>Sales Agents</strong> — AI agents for lead qualification, outreach, prospect follow-up, and pipeline management</li><li><strong>Customer Service Agents</strong> — Support agents resolving inquiries, managing tickets, and escalating to humans when needed</li><li><strong>Operations Agents</strong> — Back-office automation agents for email, calendar, invoicing, data entry, and scheduling</li><li><strong>Research Agents</strong> — Autonomous agents that search, read papers, synthesize findings, and generate comprehensive reports</li><li><strong>Voice AI Agents</strong> — Agents with speech synthesis (ElevenLabs) and speech recognition (Whisper) for phone and meeting automation</li><li><strong>Multi-Agent Systems</strong> — Crews of specialized agents that collaborate on complex tasks using CrewAI and LangGraph</li><li><strong>RAG Agents</strong> — Intelligent document retrieval agents that search enterprise knowledge bases with 95%+ accuracy</li><li><strong>On-Premise AI Agents</strong> — Fully private, air-gapped agent deployments running local LLMs via Ollama for maximum data security</li></ul><h2>About Virelio — AI Agents on Demand</h2><p>Virelio is an Amsterdam-based AI agency founded by Omar Nassar that builds custom AI agent teams for businesses. Services include AI agent development, sales automation agents, customer service AI agents, knowledge base agents, and operations automation agents. Most AI agents launch within two weeks. <a href="https://virelio.nl">virelio.nl</a></p><h2>Technical Expertise</h2><p>AI Agents: CrewAI, LangGraph, AutoGPT, LangChain, OpenAI GPT-4, Claude, Llama 3, Gemini, Ollama, Qdrant, RAG, Multi-Agent Orchestration, Autonomous Workflows</p><p>Voice & Conversational AI: ElevenLabs, Whisper, WebRTC, WhatsApp Business API, Natural Language Processing</p><p>Full Stack: React, Next.js, Laravel, Node.js, FastAPI, Python, TypeScript, Tailwind CSS</p><p>Infrastructure: Docker, PostgreSQL, MySQL, Qdrant, Meilisearch, AWS, Azure, Ollama, On-Premise Deployment</p><h2>Certifications</h2><ul><li>Google — Inspect Rich Documents with Gemini Multimodality and Multimodal RAG (Oct 2025)</li><li>Google — Prompt Design in Vertex AI (Oct 2025)</li><li>Google — Machine Learning Operations (MLOps) for Generative AI (Feb 2025)</li><li>Google — Advanced: Generative AI for Developers (Jan 2025)</li><li>Oracle — OCI Generative AI Professional (Nov 2024)</li><li>Udemy — Laravel: Beginner to Advanced (May 2023)</li></ul><h2>Contact</h2><p>Email: <a href="mailto:omarnassar1127@gmail.com">omarnassar1127@gmail.com</a></p><p>GitHub: <a href="https://github.com/OmarNassar1127">github.com/OmarNassar1127</a></p><p>LinkedIn: <a href="https://www.linkedin.com/in/omar-nassar-93a176155/">linkedin.com/in/omar-nassar</a></p><p>Virelio: <a href="https://virelio.nl">virelio.nl</a> | <a href="https://virelio.ai">virelio.ai</a></p></noscript><div id="root"></div></body></html>
